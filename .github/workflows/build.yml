name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: depth
      - name: Install ffrwd and the wit package
        run: |
          pip install ffrwd
          ffrwd install -g "ffrwd/wasm@$(python -c 'import json; print(json.load(open("depth/ffrwd.json"))["dependencies"]["ffrwd/wasm"])')"
      - name: Build depth's module
        working-directory: depth
        run: cargo build --target wasm32-wasip2 --release

  build-shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shots
      - name: Install ffrwd and the wit package
        run: |
          pip install ffrwd
          ffrwd install -g "ffrwd/wasm@$(python -c 'import json; print(json.load(open("shots/ffrwd.json"))["dependencies"]["ffrwd/wasm"])')"
      - name: Build shots' module
        working-directory: shots
        run: cargo build --target wasm32-wasip2 --release

  build-mask-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mask_tools
      - name: Install ffrwd and the wit package
        run: |
          pip install ffrwd
          ffrwd install -g "ffrwd/wasm@$(python -c 'import json; print(json.load(open("mask_tools/ffrwd.json"))["dependencies"]["ffrwd/wasm"])')"
      - name: Build mask_tools' modules
        working-directory: mask_tools
        run: cargo build --target wasm32-wasip2 --release
      - name: Unit tests
        working-directory: mask_tools
        run: cargo test --release
