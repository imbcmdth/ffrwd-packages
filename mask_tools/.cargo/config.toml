# wasm32-wasip2 leaves SIMD off by default; enable it so a module can use it.
[target.wasm32-wasip2]
rustflags = ["-C", "target-feature=+simd128"]

# spans_mask's wit comes from the ffrwd/wasm package this project pins: its
# build.rs asks `ffrwd path ffrwd/wasm` for it, so run `ffrwd install` here
# once before building. tone needs none; ffrwd-node carries its world.
